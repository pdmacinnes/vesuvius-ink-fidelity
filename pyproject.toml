[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesuvius-ink-fidelity"
version = "0.1.1"
description = "Paired, task-aware CT compression experiments for Vesuvius ink recovery"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.16,<2", "zarr>=3.1,<4", "numcodecs>=0.16,<0.17",
  "tifffile>=2025.10", "requests>=2.32.5", "scikit-learn>=1.7,<2", "psutil>=7",
]

[project.optional-dependencies]
report = ["matplotlib>=3.10", "scikit-image>=0.25"]
test = ["pytest>=8.4", "ruff"]

[project.scripts]
ink-fidelity = "ink_fidelity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "LOG"]
